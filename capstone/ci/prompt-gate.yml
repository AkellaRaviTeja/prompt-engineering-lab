# An example GitHub Actions workflow for the capstone pipeline. It is kept here, not in
# .github/workflows/, so it never runs on this repository: copy it into your own repository's
# .github/workflows/ when your pipeline lives there, and point the paths at your folder.
#
# Two jobs:
#   offline: the capstone tests against a scripted model. No model, a few seconds, every push.
#   gate:    the eval for the candidate prompt version against the baseline, on a real model,
#            only when a prompt changes. Exits non-zero on a regression beyond the tolerance.
#
# Pin each action to a full commit SHA before you rely on this; the tags below are the
# readable form.
name: prompt-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Capstone tests against a scripted model
        run: make capstone

  gate:
    needs: offline
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports: ["11434:11434"]
    env:
      OLLAMA_HOST: http://localhost:11434
      # The prompt versions under comparison. A pull request that adds a prompt version
      # changes CANDIDATE; once it merges, the candidate becomes the next baseline.
      TASK: classify-message
      BASELINE: v1
      CANDIDATE: v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only when a prompt changed
        id: prompts
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git diff --quiet "$base" HEAD -- capstone/work/prompts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.prompts.outputs.changed == 'true'
      - name: Pull the model
        if: steps.prompts.outputs.changed == 'true'
        run: |
          uv sync
          curl -fsS "$OLLAMA_HOST/api/pull" -d '{"model": "qwen3:1.7b", "stream": false}'
      - name: Gate the candidate against the baseline
        if: steps.prompts.outputs.changed == 'true'
        run: >
          uv run python capstone/work/gate.py "$TASK"
          --baseline "$BASELINE" --candidate "$CANDIDATE"
          --out gate-reports
      - name: Keep the reports
        if: always() && steps.prompts.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: gate-reports/
