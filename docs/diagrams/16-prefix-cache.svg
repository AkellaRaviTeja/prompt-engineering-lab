again, and billed again on a hosted model.</tspan><tspan x="2382.5" dy="17.25">Local: Ollama keeps the KV cache of the last prompt and skips the shared prefix.</tspan><tspan x="2382.5" dy="17.25">Hosted: cache_control marks the prefix; reads cost a tenth of input, writes a quarter more.</tspan></text></g><g class="c3RhYmxlLmEx"><g class="shape" ><rect x="97" y="298" width="379" height="66" stroke="#0D32B2" fill="#ffe8b3" class=" stroke-B1" style="stroke-width:2;" /></g><text x="286.5" y="336.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">call 1: [sorting guide, 1,900 tokens] [message 1]</text></g><g class="c3RhYmxlLmEy"><g class="shape" ><rect x="743" y="298" width="346" height="66" stroke="#0D32B2" fill="#dff5df" class=" stroke-B1" style="stroke-width:2;" /></g><text x="916" y="336.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">call 2: [sorting guide: REUSED] [message 2]</text></g><g class="c3RhYmxlLmEz"><g class="shape" ><rect x="1427" y="298" width="346" height="66" stroke="#0D32B2" fill="#dff5df" class=" stroke-B1" style="stroke-width:2;" /></g><text x="1600" y="336.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">call 3: [sorting guide: REUSED] [message 3]</text></g><g class="dmFyeWluZy5iMQ=="><g class="shape" ><rect x="50" y="86" width="473" height="66" stroke="#0D32B2" fill="#ffe8b3" class=" stroke-B1" style="stroke-width:2;" /></g><text x="286.5" y="124.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">call 1: [Request ID 9f2c, 09:14:07] [sorting guide] [message 1]</text></g><g class="dmFyeWluZy5iMg=="><g class="shape" ><rect x="623" y="86" width="585" height="66" stroke="#0D32B2" fill="#ffd6d6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="915.5" y="124.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">call 2: [Request ID 41ab, 09:14:09] [sorting guide: RECOMPUT