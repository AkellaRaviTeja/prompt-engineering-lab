upervisor&#39;s hut&#34;</tspan><tspan x="253" dy="17.25">~23:40 | hears a bang | &#34;At about twenty to twelve I heard a bang&#34;</tspan><tspan x="253" dy="17.25">23:52 | finds Reyes | &#34;I found Mr Reyes at the bottom&#34;</tspan></text></g><g class="cHJvbXB0LnRhc2s="><g class="shape" ><rect x="116" y="50" width="275" height="82" stroke="#0D32B2" fill="#ffe8b3" class=" stroke-B1" style="stroke-width:2;" /></g><text x="253.5" y="88.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="253.5" dy="0">TASK</tspan><tspan x="253.5" dy="18.5">Build a timeline of 23:00 to 23:59</tspan></text></g><g class="cHJvbXB0LmNvbnRleHQ="><g class="shape" ><rect x="67" y="232" width="373" height="82" stroke="#0D32B2" fill="#d9ecff" class=" stroke-B1" style="stroke-width:2;" /></g><text x="253.5" y="270.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="253.5" dy="0">CONTEXT</tspan><tspan x="253.5" dy="18.5">&lt;statement&gt; Petrov&#39;s statement &lt;/statement&gt;</tspan></text></g><g class="cHJvbXB0LnJ1bGVz"><g class="shape" ><rect x="60" y="414" width="386" height="98" stroke="#0D32B2" fill="#ffd6d6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="253" y="452.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="253" dy="0">RULES</tspan><tspan x="253" dy="17.666667">Quote word for word. Mark ~approximate times.</tspan><tspan x="253" dy="17.666667">List unexplained gaps.</tspan></text></g><g class="cHJvbXB0LmZvcm1hdA=="><g class="shape" ><rect x="154" y="612" width="198" height="82" stroke="#0D32B2" fill="#dff5df" class=" stroke-B1" style="stroke-width:2;" /></g><text x="253" y="650.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="253" dy="0">FORMAT</tspan><tspan x="253" dy="18.5">HH:MM | event | quote</tspan></text></g><g class="cHJvbXB0LmV4YW1wbGVz"><g class="shape" ><rect x="132" y="794" width="242" height="98" stroke="#0D32B2" fill="#eeeeee" class=" stroke-B2" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" /></g><text x="253" y="832.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="253" dy="0">EXAMPLES (optional)</tspan><tspan x="253" dy="17.666667">One or two worked answers</tspan><tspan x="253" dy="17.666667">see chapter 07</tspan></text></g><g class="cHJvbXB0Lih0YXNrIC0mZ3Q7IGNvbnRleHQpWzBd" style='opacity:0.4'><marker id="mk-d2-3159531698-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 253 134 C 253 172 253 192 253 228" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3159531698-3488378134)" mask="url(#d2-3159531698)" /></g><g class="cHJvbXB0Lihjb250ZXh0IC0mZ3Q7IHJ1bGVzKVswXQ==" style='opacity:0.4'><path d="M 253 316 C 253 354 253 374 253 410" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3159531698-3488378134)" mask="url(#d2-3159531698)" /></g><g class="cHJvbXB0LihydWxlcyAtJmd0OyBmb3JtYXQpWzBd" style='opacity:0.4'><path d="M 253 514 C 253 552 253 572 253 608" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3159531698-3488378134)" mask="url(#d2-3159531698)" /></g><g class="cHJvbXB0Lihmb3JtYXQgLSZndDsgZXhhbXBsZXMpWzBd" style='opacity:0.4'><path d="M 253 696 C 253 734 253 754 253 790" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3159531698-3488378134)" mask="url(#d2-3159531698)" /></g><g class="KHByb21wdCAtJmd0OyBtb2RlbClbMF0="><path d="M 253 924 C 253 978 253 1002 253 1038" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#m