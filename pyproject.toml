[project]
name = "prompt-engineering-lab"
version = "0.1.0"
description = "Learn prompt engineering by working a crime case on a local LLM. Case File 01 of The Lantern Files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Optional cloud providers. LANTERN runs on Ollama; these exist for comparison only.
cloud = ["anthropic>=0.40", "openai>=1.50", "google-genai>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "matplotlib>=3.9", "playwright>=1.48"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lantern"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a running Ollama with the configured models"]
addopts = "-m 'not live'"
